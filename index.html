			if(forgetPop){

		function fitElements(){
			const itemsToFit = document.getElementsByClassName('fitText');
			for (const item in itemsToFit) {
				if (Object.hasOwnProperty.call(itemsToFit, item)) {
					var element = itemsToFit[item];
					fitElement(element,1, 1000);
					element.classList.remove('fitText');
				}
			}
		}

		function fitElement(element, start, end){

			let size = (end + start) / 2;
			element.style.fontSize = `${size}px`;

			if(Math.abs(start - end) < 1){
				while(element.scrollHeight > element.offsetHeight){
					size--;
					element.style.fontSize = `${size}px`;
				}
				return;
			}

			if(element.scrollHeight > element.offsetHeight){
				fitElement(element, start, size);
			} else {
				fitElement(element, size, end);
			}		
		}


		document.onreadystatechange = () => {
			fitElements();
			if (document.readyState === 'complete') {
				if (window.location.href.indexOf("?export") != -1){
					parent.postMessage(event.target.location.href, "app://obsidian.md");
				}
				if (window.location.href.indexOf("print-pdf") != -1){

Jeder Beruf = Bündel von Aufgaben

| KI übernimmt | KI hilft | bleibt menschlich |
|---|---|---|
| Routinetexte, Übersetzung, Standardcode | Recherche, Entwürfe, Analyse | Verantwortung, Beziehungen, Urteil, Handwerk |
</div>

<aside class="notes"><p>KI frisst keine Arbeitsplätze</p>
<p>Wo KI Arbeit <em>ersetzt</em>, sinkt Beschäftigung; 
wo sie Menschen <em>unterstützt</em>, wächst sie.</p>
<p>Wozu führt das?</p>

## 1
## Weniger Einstiegsjobs

- 22–25-Jährige in stark KI-betroffenen Berufen: **–19 %** Beschäftigung ggü. weniger betroffenen Berufen
- Ein Jahr vorher: –13 %
- Ursache: **weniger Neueinstellungen** – nicht Entlassungen
- Erfahrene kaum betroffen


<small>Stanford Digital Economy Lab, Update Aug. 2026 · US-Lohndaten (ADP)</small>
</div>

<aside class="notes"><p>Warum gerade Junge? Schul-/Lehrbuchwissen kann KI gut nachbilden, Erfahrungswissen kaum.
Quellenqualität: hoch (große administrative Datenbasis), aber nur beschreibend, keine Kausalität. NY-Fed-Forscher: Abkühlung nicht allein KI zuzuschreiben. Nur USA.</p>
</aside></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->

## Prognosen

| Wer                        | Was                                      | Wie belastbar       |
| -------------------------- | ---------------------------------------- | ------------------- |
| WEF (global, bis 2030)     | 170 Mio. neu, 92 Mio. weg → **+78 Mio.** | Arbeitgeber-Umfrage |
| IAB (Deutschland, 15 J.)   | ~790.000 neu, ~790.000 weg → **≈ 0**     | Modell              |
| Goldman Sachs (USA, 10 J.) | ~9 % müssen Job wechseln                 | Modell              |
|                            |                                          |                     |
<!-- .element: style="font-size: .9em" -->

Notes:

**Gesamtzahl ist die falsche Frage.**
Entscheidend: *Wo* fallen Jobs weg – und wer kommt an die neuen?

Wachstum: Pflege, Bildung, Handwerk/Bau, KI/Robotik, CleanTech.
Rückgang: Kasse, Verwaltung, Büro-Einstieg, zunehmend auch kreative Wissensarbeit (Grafik).
Deutschland-Besonderheit: Erwerbspersonenpotenzial schrumpft (IAB) → Stellenabbau ≠ automatisch Arbeitslosigkeit.
Ehrlich bleiben: Unsicherheit groß, Risiko eher auf der Abbau-Seite, wenn KI schneller kommt als gedacht. Amodei-Warnung (Hälfte der Büro-Einstiegsjobs in 5 Jahren) = Warnung, keine Prognose.
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->

	- Websites lesen und zusammenfassen
	- Gespräche aufschreiben und zusammenfassen
	- Präsentationen vorbereiten


Brücke zu Folie „Weniger Einstiegsjobs“: Genau solche Entwurfsaufgaben haben früher Berufseinsteiger:innen gemacht.

Ideal: eine kurze Live-Demo oder ein Screenshot eines echten (anonymisierten) Prompts.

## Fünf Dinge zum Mitnehmen

1. **KI als Werkzeug, nicht als Ersatz fürs Denken** – wer nur kopiert, lernt genau das, was KI eh kann
2. **Früh Praxis sammeln** – Praktika, Nebenjobs, Projekte: Erfahrung kann KI nicht nachbilden
3. **Menschliches stärken** – Empathie, Verantwortung, Urteilskraft, Handwerk
4. **Lernen hört nicht auf** – 59 von 100 Beschäftigten brauchen bis 2030 Weiterbildung (WEF)
5. **Kritisch bleiben** – Wer sagt das, mit welchen Daten, mit welchem Interesse?
</div>

<aside class="notes"><p>Punkt 2 ist die direkte Antwort auf die Einstiegsjob-Daten.
Punkt 5 verbindet sich mit dem Google-Quiz.</p>

      function extend() {
        var target = {};
        for (var i = 0; i < arguments.length; i++) {
          var source = arguments[i];
          for (var key in source) {
            if (source.hasOwnProperty(key)) {
              target[key] = source[key];
            }
          }
        }
        return target;
      }

	  function isLight(color) {
		let hex = color.replace('#', '');

		// convert #fff => #ffffff
		if(hex.length == 3){
			hex = `${hex[0]}${hex[0]}${hex[1]}${hex[1]}${hex[2]}${hex[2]}`;
		}

		const c_r = parseInt(hex.substr(0, 2), 16);
		const c_g = parseInt(hex.substr(2, 2), 16);
		const c_b = parseInt(hex.substr(4, 2), 16);
		const brightness = ((c_r * 299) + (c_g * 587) + (c_b * 114)) / 1000;
		return brightness > 155;
	}

	var bgColor = getComputedStyle(document.documentElement).getPropertyValue('--r-background-color').trim();
	var isLight = isLight(bgColor);

	if(isLight){
		document.body.classList.add('has-light-background');
	} else {
		document.body.classList.add('has-dark-background');
	}

      // default options to init reveal.js
